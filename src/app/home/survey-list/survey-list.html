<section class="survey_list" aria-label="Survey overview">

  <div class="survey_toolbar">
    <div class="survey_filters" role="group" aria-label="Survey status">
      <button appFilterButton type="button" [attr.aria-pressed]="filters.status() === 'active'" (click)="filters.status.set('active')">Active survey</button>
      <button appFilterButton type="button" [attr.aria-pressed]="filters.status() === 'past'" (click)="filters.status.set('past')">Past survey</button>
    </div>
    <app-category-dropdown [selectedCategory]="filters.category()" (selectedCategoryChange)="filters.category.set($event)" />
  </div>
  <ul class="survey_grid" tabindex="0" aria-label="Filtered surveys">
    @for (survey of visibleSurveys; track survey.id) {
      <li><app-survey-list-card [survey]="survey" /></li>
    } @empty {
      <li class="empty_state" role="status">
        No {{ filters.status() === 'active' ? 'active' : 'past' }} surveys{{ filters.category() === 'All Surveys' ? '' : ' in this category' }} yet.
      </li>
    }
  </ul>
</section>
