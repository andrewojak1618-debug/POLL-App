<div class="category_dropdown" (keydown.escape)="close(trigger)" (focusout)="onFocusOut($event)">
  <button #trigger class="category_trigger" type="button"
    [class.is_active]="isOpen || selectedCategory !== null"
    [attr.aria-expanded]="isOpen" aria-controls="survey_category_options" (click)="toggle()">
    <span>Sort by categories</span>
    <span class="arrow" [class.is_open]="isOpen" aria-hidden="true">
      <img src="icons/arrow_drop_down.svg" width="15" height="8" alt="" />
    </span>
  </button>
  @if (selectedCategory !== null) {
    <p class="selected_category" aria-live="polite">{{ selectedCategoryName }}</p>
  }
  <div id="survey_category_options" class="category_options" [hidden]="!isOpen"
    role="group" aria-label="Categories">
    <button class="category_option" type="button" [attr.aria-pressed]="selectedCategory === null"
      (click)="select(null, trigger)">All Surveys</button>
    @for (category of categories; track category.id) {
      <button class="category_option" type="button" [attr.aria-pressed]="selectedCategory === category.id"
        (click)="select(category.id, trigger)">{{ category.name }}</button>
    }
  </div>
</div>
