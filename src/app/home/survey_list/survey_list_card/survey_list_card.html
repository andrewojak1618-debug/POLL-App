<article>
  <a class="survey_card" [class.is_previewed]="isPreviewed()" [routerLink]="['/surveys', survey().id]">
    <div class="card_heading">
      <p class="category">{{ survey().category.name }}</p>
      <h3>{{ survey().title }}</h3>
    </div>
    <p class="deadline">{{ deadlineLabel() }}</p>
  </a>
</article>
