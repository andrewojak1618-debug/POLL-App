<div class="survey-form" [formGroup]="form">
  <div class="survey-details">
    <div class="survey-basics">
      <label for="survey-name">Survey name</label>
      <div class="input-row">
        <input #nameInput id="survey-name" formControlName="name" />
        <button type="button" class="clear-button" aria-label="Clear survey name" (click)="clear(fields.name, nameInput)">
          <img src="icons/delete.svg" width="18" height="20" alt="" />
        </button>
      </div>
      <div class="date-category">
        <div>
          <label for="survey-end-date">Set end date <span>(optional)</span></label>
          <div class="input-row">
            <input #dateInput id="survey-end-date" type="date" formControlName="endDate" />
            <button type="button" class="clear-button" aria-label="Clear end date" (click)="clear(fields.endDate, dateInput)">
              <img src="icons/delete.svg" width="18" height="20" alt="" />
            </button>
          </div>
        </div>
        <select id="survey-category" aria-label="Choose category" formControlName="category">
          <option value="" disabled>Choose category</option>
          @for (category of categories; track category) {
            <option [value]="category">{{ category }}</option>
          }
        </select>
      </div>
    </div>
    <div>
      <label for="survey-description">Describing text <span>(optional)</span></label>
      <div class="input-row description-row">
        <textarea #descriptionInput id="survey-description" formControlName="description" rows="4"></textarea>
        <button type="button" class="clear-button" aria-label="Clear description" (click)="clear(fields.description, descriptionInput)">
          <img src="icons/delete.svg" width="18" height="20" alt="" />
        </button>
      </div>
    </div>
  </div>

  <div class="question-section">
    <fieldset>
      <legend class="visually-hidden">First question and answers</legend>
      <div class="question-heading">
        <label for="survey-question">1. Question</label>
        <button type="button" class="clear-button" aria-label="Clear first question" (click)="clear(fields.question, questionInput)">
          <img src="icons/delete.svg" width="18" height="20" alt="" />
        </button>
      </div>
      <input #questionInput id="survey-question" formControlName="question" placeholder="Which date would work best for you?" />
      <div class="answers-heading">
        <span>Answers</span>
        <label class="multiple-answers">
          <input type="checkbox" formControlName="multipleAnswers" />
          Allow multiple answers.
        </label>
      </div>
      <div class="input-row answer-row">
        <label for="survey-answer-a">A.</label>
        <input #answerAInput id="survey-answer-a" aria-label="Answer A" formControlName="answerA" />
        <button type="button" class="clear-button" aria-label="Clear answer A" (click)="clear(fields.answerA, answerAInput)">
          <img src="icons/delete.svg" width="18" height="20" alt="" />
        </button>
      </div>
      <div class="input-row answer-row">
        <label for="survey-answer-b">B.</label>
        <input #answerBInput id="survey-answer-b" aria-label="Answer B" formControlName="answerB" />
        <button type="button" class="clear-button" aria-label="Clear answer B" (click)="clear(fields.answerB, answerBInput)">
          <img src="icons/delete.svg" width="18" height="20" alt="" />
        </button>
      </div>
      <button type="button" class="add-answer" disabled title="Available in a later step">
        Add answer <img src="icons/add_circle.svg" width="20" height="20" alt="" />
      </button>
    </fieldset>
    <button type="button" class="add-question" disabled title="Available in a later step">
      Add next question <img src="icons/add_circle.svg" width="20" height="20" alt="" />
    </button>
  </div>
</div>
