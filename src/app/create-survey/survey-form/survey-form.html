<div class="survey_form" [formGroup]="form">
  <div class="survey_details">
    <div class="survey_basics">
      <label for="survey_name">Survey name</label>
      <div class="input_row">
        <input #nameInput id="survey_name" formControlName="name" />
        <button type="button" class="clear_button" aria-label="Clear survey name" (click)="clear(fields.name, nameInput)">
          <img src="icons/delete.svg" width="18" height="20" alt="" />
        </button>
      </div>
      <div class="date_category">
        <div>
          <label for="survey_end_date">Set end date <span>(optional)</span></label>
          <div class="input_row">
            <input #dateInput id="survey_end_date" type="date" formControlName="endDate" />
            <button type="button" class="clear_button" aria-label="Clear end date" (click)="clear(fields.endDate, dateInput)">
              <img src="icons/delete.svg" width="18" height="20" alt="" />
            </button>
          </div>
        </div>
        <select id="survey_category" aria-label="Choose category" formControlName="category">
          <option value="" disabled>Choose category</option>
          @for (category of categories; track category) {
            <option [value]="category">{{ category }}</option>
          }
        </select>
      </div>
    </div>
    <div>
      <label for="survey_description">Describing text <span>(optional)</span></label>
      <div class="input_row description_row">
        <textarea #descriptionInput id="survey_description" formControlName="description" rows="4"></textarea>
        <button type="button" class="clear_button" aria-label="Clear description" (click)="clear(fields.description, descriptionInput)">
          <img src="icons/delete.svg" width="18" height="20" alt="" />
        </button>
      </div>
    </div>
  </div>

  <div class="question_section">
    <fieldset>
      <legend class="visually_hidden">First question and answers</legend>
      <div class="question_heading">
        <label for="survey_question">1. Question</label>
        <button type="button" class="clear_button" aria-label="Clear first question" (click)="clear(fields.question, questionInput)">
          <img src="icons/delete.svg" width="18" height="20" alt="" />
        </button>
      </div>
      <input #questionInput id="survey_question" formControlName="question" placeholder="Which date would work best for you?" />
      <div class="answers_heading">
        <span>Answers</span>
        <label class="multiple_answers">
          <input type="checkbox" formControlName="multipleAnswers" />
          Allow multiple answers.
        </label>
      </div>
      @for (answer of answers.controls; track answer; let index = $index) {
        <div class="input_row answer_row">
          <label [for]="'survey_answer_' + index">{{ answerLabel(index) }}.</label>
          <input [id]="'survey_answer_' + index" [attr.aria-label]="'Answer ' + answerLabel(index)" [formControl]="answer" />
          <button type="button" class="clear_button"
            [attr.aria-label]="(answers.length > 2 ? 'Remove answer ' : 'Clear answer ') + answerLabel(index)"
            (click)="removeAnswer(index)">
            <img src="icons/delete.svg" width="18" height="20" alt="" />
          </button>
        </div>
      }
      <button type="button" class="add_answer" (click)="addAnswer()">
        Add answer
        <span class="add_answer_icon"><img src="icons/add_circle_white.svg" width="16" height="16" alt="" /></span>
      </button>
    </fieldset>
    <button type="button" class="add_question" disabled title="Available in a later step">
      Add next question <img src="icons/add_circle.svg" width="20" height="20" alt="" />
    </button>
  </div>
</div>
